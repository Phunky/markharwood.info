name: Build and push Docker image

on:
  push:
    branches:
      - production

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Now page last commit (ISO)
        id: nowpage
        run: |
          echo "iso=$(git log -1 --format=%cI -- src/pages/now.astro)" >> "$GITHUB_OUTPUT"

      - name: Uses page last commit (ISO)
        id: usespage
        run: |
          echo "iso=$(git log -1 --format=%cI -- src/pages/uses.astro)" >> "$GITHUB_OUTPUT"

      # Repository secrets (e.g. LASTFM_API_KEY) → PUBLIC_* so Vite exposes them to the client fetch.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PUBLIC_LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}
            PUBLIC_LASTFM_USER=${{ secrets.LASTFM_USER }}
            PUBLIC_NOW_LAST_UPDATED=${{ steps.nowpage.outputs.iso }}
            PUBLIC_USES_LAST_UPDATED=${{ steps.usespage.outputs.iso }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
